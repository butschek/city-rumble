# Roth Rumble · Licencja i informacje o źródłach


**Roth Rumble**  
*Stan na 11 listopada 2026 r.*

## Korzystanie z gry

Każdy może grać w Roth Rumble w dowolnym momencie.

## Dostępność i odpowiedzialność

Gra jest udostępniana bez gwarancji stałej dostępności. Pomimo starannego przygotowania mogą wystąpić błędy techniczne. Nie narusza to roszczeń z tytułu odpowiedzialności wynikających z bezwzględnie obowiązujących przepisów prawa.
