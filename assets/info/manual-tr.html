# Roth Rumble

## Roth’ta kartopu savaşı!

Bir kartopu savaşına hazır mısın? **Roth Rumble**’da üç kırmızı karakterle gittikçe güçlenen bir rakip takıma karşı oynarsın. Oyun **6 ila 99 yaş arasındaki** herkes için. Öğrenmesi kolay, kazanması ise hiç de kolay değil!

Oyunu özel kılan şu: **Oyundaki tüm mekânlar güzel şehrimiz Roth’tan!** Şehrindeki tanıdık yerleri keşfet ve Roth’un tam ortasında kartopu savaşı yap. Roth’tan, Roth için ve şehrimizi seven herkes için bir oyun!

## Nasıl oynanır?

Takımın sağda, rakiplerin solda. **Kendi karakterlerin elenmeden tüm rakipleri oyun dışı bırak!** Karakterlerinin her biri iki, rakiplerin her biri ise üç isabete dayanır. Kazandığın her bölümden sonra rakiplerin sayısı artar. Seni toplam **altı bölüm** bekliyor.

**Kontroller:** Kırmızı karakterlerinden birini fareyle ya da parmağınla tut ve istediğin yere sürükle. Atış gücünü artırmak için basılı tut. **Bıraktığında kartopu** sola ve biraz yukarıya doğru uçar. Ne kadar uzun basılı tutarsan o kadar uzağa gider.

## Puan toplama

- **10 puan**, rakibi oyun dışı bırakmayan her isabet için
- **50 puan**, rakibi oyun dışı bırakan bir isabet için
- **1.000 puan**, kazandığın her bölüm için
- Karakterlerin olabildiğince az isabet alırsa **2.700’e kadar bonus puan**
- Bölümü çok hızlı kazanırsan **1.440’a kadar bonus puan**

Oyunun sonunda adını **skor tablosuna** yazdırabilirsin.

## Kazanmak için ipuçları

- **Önceliğini kullan:** Rakipler ancak üç saniye sonra atmaya başlar. O zamana kadar karakterlerini güvenli bir yere götür.
- **Tek karakterle oyna:** Diğerlerini mümkün olduğunca arkada tut. Böylece güvende kalırlar.
- **Siperden at:** Güvenli bir yerde atış gücünü topla. Atmak için karakterini öne çıkar, sonra hemen geri çek.
- **İyi nişan al:** Kartopların biraz yukarı doğru uçar. Daha alçak bir konumdan isabet ettirmek çoğu zaman daha kolaydır.
- **Tam güçle at:** Atışı biraz daha uzun süre hazırla. Zayıf atışlar çoğu zaman rakibe ulaşmaz.
- **Teker teker ilerle:** Bir sonraki rakibe saldırmadan önce ilkini tamamen oyun dışı bırakmaya çalış. Daha az rakip, sana doğru gelen daha az kartopu demek!

**Unutma:** Karakterlerin ne kadar az isabet alırsa ve ne kadar hızlı kazanırsan o kadar çok puan toplarsın!

## Roth’u daha yakından tanımak ister misin?

Oyundaki bazı yerleri tanıdın mı? Hiç şaşırmadık! Mekânlar güzel memleketimiz **Roth**’un tanıdık köşelerini gösteriyor.

Daha fazlasını keşfetmek ister misin? **[Rothzeit.de](https://rothzeit.de)** adresinde şehrimizin mağazalarını, restoranlarını, kafelerini ve daha birçok seçeneği bulabilir, Roth’taki etkinliklere ve önerilere göz atabilirsin.

**Roth’ta kartopu savaşı yaparken iyi eğlenceler!**
