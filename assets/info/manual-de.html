# Roth Rumble

## Schneeballschlacht in Roth!

Bereit für eine Runde Schneeball-Action? Bei **Roth Rumble** spielst Du mit drei roten Figuren gegen ein immer stärkeres gegnerisches Team. Das Spiel ist für alle von **6 bis 99 Jahren** gedacht – leicht zu lernen, aber gar nicht so einfach zu gewinnen!

Das Besondere: **Alle Schauplätze im Spiel stammen aus unserer schönen Stadt Roth!** Entdecke bekannte Orte aus Deiner Heimat und erlebe eine Schneeballschlacht mitten in Roth. Ein Spiel aus Roth – für Roth und alle, die unsere Stadt mögen!

## So funktioniert's

Dein Team steht rechts, die Gegner sind links. **Schalte alle Gegner aus, bevor Deine eigenen Figuren besiegt werden!** Deine Figuren halten jeweils zwei Treffer aus, die Gegner drei. Mit jedem gewonnenen Level werden es mehr Gegner. Insgesamt warten **sechs Level** auf Dich.

**Steuerung:** Greife eine Deiner roten Figuren mit der Maus oder dem Finger und ziehe sie an die gewünschte Stelle. Halte gedrückt, um die Wurfkraft aufzuladen. **Beim Loslassen fliegt der Schneeball** nach links, leicht nach oben. Je länger Du auflädst, desto weiter fliegt er.

## Punkte sammeln

- **10 Punkte** für jeden Treffer, der einen Gegner noch nicht ausschaltet
- **50 Punkte** für einen Treffer, der einen Gegner ausschaltet
- **1.000 Punkte** für jedes gewonnene Level
- **Bis zu 2.700 Bonuspunkte**, wenn Deine Figuren möglichst wenig getroffen wurden
- **Bis zu 1.440 Bonuspunkte**, wenn Du das Level besonders schnell gewinnst

Am Spielende kannst Du Deinen Namen in die **Highscore-Liste** eintragen.

## Tipps für den Sieg

- **Nutze Deinen Vorsprung:** Die Gegner werfen erst nach drei Sekunden. Bringe Deine Figuren vorher in Sicherheit.
- **Spiele mit einer Figur:** Lass die anderen möglichst weit hinten stehen. So bleiben sie geschützt.
- **Aus der Deckung werfen:** Lade Deinen Schneeball in Sicherheit auf. Bewege Deine Figur zum Werfen nach vorne und ziehe sie danach sofort wieder zurück.
- **Gut zielen:** Deine Schneebälle fliegen leicht nach oben. Von einer tiefen Position kannst Du oft besonders gut treffen.
- **Volle Wurfkraft:** Lade lieber etwas länger auf. Zu schwache Würfe erreichen den Gegner oft nicht.
- **Einen nach dem anderen:** Schalte einen Gegner möglichst ganz aus, bevor Du den nächsten angreifst. Weniger Gegner bedeuten weniger feindliche Schneebälle!

**Denk daran:** Je weniger Treffer Deine Figuren abbekommen und je schneller Du gewinnst, desto mehr Punkte sammelst Du!

## Noch mehr Roth entdecken?

Du erkennst einige Orte im Spiel wieder? Kein Wunder! Die Schauplätze zeigen bekannte Ecken unserer schönen Heimatstadt **Roth**.

Du möchtest noch mehr entdecken? Auf **[Rothzeit.de](https://rothzeit.de)** findest Du Geschäfte, Restaurants, Cafés und viele weitere Angebote aus unserer Stadt – außerdem Veranstaltungen und Tipps, was in Roth los ist.

**Viel Spaß bei Deiner Schneeballschlacht durch Roth!**
