# Roth Rumble

## Снежная битва в Роте!

Хочешь поиграть в снежки? В **Roth Rumble** ты играешь тремя красными персонажами против команды, которая становится всё сильнее. Игра для всех **от 6 до 99 лет**. Научиться играть легко, а вот победить не так просто!

Что делает игру особенной? **Все места в игре — из нашего прекрасного города Рот!** Открой для себя знакомые места родного города и устрой снежную битву в самом Роте. Игра из Рота, для Рота и всех, кто любит наш город!

## Как играть

Твоя команда справа, а соперники слева. **Выведи из игры всех соперников, пока твои персонажи ещё в строю!** Каждый твой персонаж выдерживает два попадания, а каждый соперник — три. После каждого выигранного уровня соперников становится больше. Всего тебя ждут **шесть уровней**.

**Управление:** Возьми одного из красных персонажей мышью или пальцем и перетащи его в нужное место. Продолжай удерживать, чтобы набрать силу броска. **Когда отпустишь, снежок полетит** влево и немного вверх. Чем дольше удерживаешь, тем дальше он летит.

## Как набрать очки

- **10 очков** за каждое попадание, после которого соперник остаётся в игре
- **50 очков** за попадание, которое выводит соперника из игры
- **1 000 очков** за каждый выигранный уровень
- **До 2 700 бонусных очков**, если в твоих персонажей попали как можно меньше раз
- **До 1 440 бонусных очков**, если выиграешь уровень особенно быстро

В конце игры можешь добавить своё имя в **таблицу рекордов**.

## Советы для победы

- **Воспользуйся преимуществом на старте:** Соперники начинают бросать снежки только через три секунды. Успей отвести своих персонажей в безопасное место.
- **Играй одним персонажем:** Оставь остальных как можно дальше позади, чтобы они были в безопасности.
- **Бросай из укрытия:** Набери силу броска в безопасном месте. Выведи персонажа вперёд для броска и сразу отведи его назад.
- **Целься внимательно:** Твои снежки летят немного вверх. С более низкой позиции часто легче попасть.
- **Бросай в полную силу:** Лучше набирать силу немного дольше. Слабые броски часто не долетают до соперника.
- **По одному:** Старайся вывести одного соперника из игры, прежде чем атаковать следующего. Меньше соперников — меньше снежков летит в твою сторону!

**Помни:** Чем меньше попаданий получат твои персонажи и чем быстрее ты победишь, тем больше очков наберёшь!

## Хочешь узнать больше о Роте?

Узнаёшь некоторые места в игре? Неудивительно! Это знакомые уголки нашего прекрасного родного города **Рот**.

Хочешь узнать больше? На **[Rothzeit.de](https://rothzeit.de)** ты найдёшь магазины, рестораны, кафе и много других предложений нашего города, а также события и подсказки о том, что происходит в Роте.
