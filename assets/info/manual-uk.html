# Roth Rumble

## Снігова битва в Роті!

Готовий до гри в сніжки? У **Roth Rumble** ти граєш трьома червоними персонажами проти команди суперників, яка стає дедалі сильнішою. Гра для всіх віком **від 6 до 99 років**. Навчитися грати легко, а от перемогти — справжній виклик!

А ось що робить гру особливою: **усі її локації — з нашого чудового міста Рот!** Відкрий для себе знайомі куточки рідного міста й влаштуй снігову битву в самому Роті. Гра з Рота — для Рота й усіх, хто любить наше місто!

## Як грати

Твоя команда праворуч, а суперники ліворуч. **Виведи з гри всіх суперників, перш ніж вибудуть твої персонажі!** Кожен твій персонаж витримує два влучання, а кожен суперник — три. Після кожного виграного рівня суперників стає більше. Загалом на тебе чекає **шість рівнів**.

**Керування:** Захопи одного з червоних персонажів мишею або пальцем і перетягни його в потрібне місце. Не відпускай, щоб набрати силу кидка. **Коли відпустиш, сніжка полетить** ліворуч і трохи вгору. Що довше набираєш силу, то далі вона летить.

## Як набирати очки

- **10 очок** за кожне влучання, після якого суперник залишається в грі
- **50 очок** за влучання, яке виводить суперника з гри
- **1 000 очок** за кожен виграний рівень
- **До 2 700 бонусних очок**, якщо твої персонажі отримають якомога менше влучань
- **До 1 440 бонусних очок**, якщо виграєш рівень особливо швидко

Наприкінці гри можеш додати своє ім’я до **таблиці рекордів**.

## Поради для перемоги

- **Скористайся перевагою на старті:** Суперники почнуть кидати сніжки лише через три секунди. Встигни відвести своїх персонажів у безпечне місце.
- **Грай одним персонажем:** Залишай інших якомога далі позаду, щоб вони були в безпеці.
- **Кидай з укриття:** Набирай силу кидка в безпечному місці. Виведи персонажа вперед, щоб кинути сніжку, а потім одразу відведи його назад.
- **Прицілюйся уважно:** Твої сніжки летять трохи вгору. З нижньої позиції часто легше влучити.
- **Кидай на повну силу:** Краще набирати силу трохи довше. Слабкі кидки часто не долітають до суперника.
- **По одному:** Намагайся повністю вивести одного суперника з гри, перш ніж атакувати наступного. Менше суперників — менше ворожих сніжок!

**Пам’ятай:** Що менше влучань отримують твої персонажі й що швидше ти перемагаєш, то більше очок набираєш!
