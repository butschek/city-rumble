# Roth Rumble

## Bataille de boules de neige à Roth !

Prêt pour une bataille de boules de neige ? Dans **Roth Rumble**, tu joues avec trois personnages rouges face à une équipe qui devient de plus en plus forte. Le jeu s’adresse à tout le monde, **de 6 à 99 ans**. Facile à apprendre, mais pas si facile à gagner !

Ce qui rend ce jeu spécial ? **Tous les lieux du jeu viennent de notre belle ville de Roth !** Découvre des coins familiers de ta ville et lance-toi dans une bataille de boules de neige en plein Roth. Un jeu créé à Roth, pour Roth et pour toutes les personnes qui aiment notre ville !

## Comment jouer

Ton équipe est à droite, et tes adversaires sont à gauche. **Élimine tous les adversaires avant que tes propres personnages soient battus !** Chacun de tes personnages résiste à deux impacts, et chaque adversaire à trois. Après chaque niveau gagné, les adversaires sont plus nombreux. **Six niveaux** t’attendent au total.

**Commandes :** Saisis l’un de tes personnages rouges avec la souris ou le doigt et fais-le glisser à l’endroit voulu. Maintiens la pression pour charger le lancer. **Quand tu relâches, la boule de neige part** vers la gauche, légèrement vers le haut. Plus tu charges le lancer, plus elle va loin.

## Marquer des points

- **10 points** pour chaque touche qui laisse un adversaire en jeu
- **50 points** pour une touche qui élimine un adversaire
- **1 000 points** pour chaque niveau gagné
- **Jusqu’à 2 700 points bonus** si tes personnages reçoivent le moins de coups possible
- **Jusqu’à 1 440 points bonus** si tu gagnes le niveau très rapidement

À la fin de la partie, tu peux inscrire ton nom au **classement des meilleurs scores**.

## Conseils pour gagner

- **Profite de ton avance :** Tes adversaires attendent trois secondes avant de lancer. Mets tes personnages à l’abri d’ici là.
- **Joue avec un seul personnage :** Laisse les autres le plus loin possible à l’arrière pour les protéger.
- **Lance depuis un abri :** Charge ton lancer à l’abri. Avance ton personnage pour lancer, puis ramène-le aussitôt en arrière.
- **Vise bien :** Tes boules de neige partent légèrement vers le haut. Depuis une position basse, il est souvent plus facile de toucher ta cible.
- **Lance à pleine puissance :** Mieux vaut charger le lancer un peu plus longtemps. Les lancers trop faibles n’atteignent souvent pas l’adversaire.
- **Un adversaire à la fois :** Essaie d’éliminer un adversaire avant de t’attaquer au suivant. Moins d’adversaires, c’est moins de boules de neige qui arrivent sur toi !

**Souviens-toi :** Moins tes personnages se font toucher et plus tu gagnes vite, plus tu marques de points !

## Envie de découvrir Roth ?

Tu reconnais certains endroits dans le jeu ? Rien d’étonnant ! Ce sont des coins familiers de notre belle ville de **Roth**.

Envie d’en découvrir davantage ? Sur **[Rothzeit.de](https://rothzeit.de)**, tu trouveras des commerces, des restaurants, des cafés et bien d’autres adresses de notre ville, ainsi que des événements et des idées de sorties à Roth.

**Amuse-toi bien dans ta bataille de boules de neige à travers Roth !**
