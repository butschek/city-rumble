# Roth Rumble

## Bătaie cu bulgări în Roth!

Gata de o bătaie cu bulgări? În **Roth Rumble**, joci cu trei personaje roșii împotriva unei echipe care devine tot mai puternică. Jocul este pentru toți cei cu vârste între **6 și 99 de ani**. E ușor de învățat, dar victoria e o adevărată provocare!

Ce face jocul special? **Toate locurile din joc sunt din frumosul nostru oraș Roth!** Descoperă locuri cunoscute din orașul tău și intră într-o bătaie cu bulgări chiar în inima orașului Roth. Un joc din Roth, pentru Roth și pentru toți cei care iubesc orașul nostru!

## Cum se joacă

Echipa ta se află în dreapta, iar adversarii în stânga. **Elimină toți adversarii înainte să fie învinse personajele tale!** Fiecare personaj al tău rezistă la două lovituri, iar fiecare adversar la trei. După fiecare nivel câștigat apar mai mulți adversari. Te așteaptă în total **șase niveluri**.

**Comenzi:** Prinde unul dintre personajele roșii cu mouse-ul sau cu degetul și trage-l unde vrei. Ține apăsat ca să mărești puterea aruncării. **Când îi dai drumul, bulgărele zboară** spre stânga și puțin în sus. Cu cât ții apăsat mai mult, cu atât zboară mai departe.

## Cum aduni puncte

- **10 puncte** pentru fiecare lovitură după care adversarul rămâne în joc
- **50 de puncte** pentru o lovitură care elimină un adversar
- **1.000 de puncte** pentru fiecare nivel câștigat
- **Până la 2.700 de puncte bonus** dacă personajele tale sunt lovite cât mai rar
- **Până la 1.440 de puncte bonus** dacă câștigi nivelul foarte repede

La finalul jocului, îți poți înscrie numele în **clasament**.

## Sfaturi pentru victorie

- **Profită de avans:** Adversarii încep să arunce abia după trei secunde. Du-ți personajele la adăpost înainte de asta.
- **Joacă doar cu un personaj:** Lasă-le pe celelalte cât mai în spate ca să fie la adăpost.
- **Aruncă de la adăpost:** Încarcă aruncarea într-un loc sigur. Adu personajul în față ca să arunci, apoi retrage-l imediat.
- **Țintește cu grijă:** Bulgării tăi zboară puțin în sus. Adesea e mai ușor să lovești dintr-o poziție mai joasă.
- **Aruncă la putere maximă:** E mai bine să încarci puțin mai mult. Aruncările slabe adesea nu ajung la adversar.
- **Ia-i pe rând:** Încearcă să elimini un adversar înainte să-l ataci pe următorul. Mai puțini adversari înseamnă mai puțini bulgări aruncați spre tine!

**Ține minte:** Cu cât personajele tale primesc mai puține lovituri și câștigi mai repede, cu atât aduni mai multe puncte!

## Vrei să descoperi mai mult din Roth?

Recunoști câteva locuri din joc? Nicio mirare! Locațiile înfățișează colțuri cunoscute din frumosul nostru oraș natal, **Roth**.

Vrei să descoperi și mai multe? Pe **[Rothzeit.de](https://rothzeit.de)** găsești magazine, restaurante, cafenele și multe alte oferte din orașul nostru, precum și evenimente și sugestii despre ce se întâmplă în Roth.

**Distracție plăcută la bătaia cu bulgări prin Roth!**
