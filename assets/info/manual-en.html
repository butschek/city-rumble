# Roth Rumble

## Snowball fight in Roth!

Ready for some snowball action? In **Roth Rumble**, you play with three red characters against a team that gets stronger as you go. The game is for everyone aged **6 to 99**. It’s easy to learn and quite a challenge to win!

Here’s what makes it special: **Every location in the game is from our lovely town of Roth!** Discover familiar spots from your hometown and have a snowball fight right in the middle of Roth. A game from Roth, for Roth and everyone who loves our town!

## How to play

Your team is on the right, and your opponents are on the left. **Knock out every opponent before your own characters are defeated!** Each of your characters can take two hits, while each opponent can take three. After every level you win, you’ll face more opponents. There are **six levels** in all.

**Controls:** Grab one of your red characters with the mouse or your finger and drag them where you want them to go. Keep holding to build up throwing power. **When you release, the snowball flies** to the left and slightly upward. The longer you charge, the farther it flies.

## Scoring points

- **10 points** for every hit that leaves an opponent in play
- **50 points** for a hit that knocks out an opponent
- **1,000 points** for every level you win
- **Up to 2,700 bonus points** for keeping the hits on your characters to a minimum
- **Up to 1,440 bonus points** for winning the level especially quickly

At the end of the game, you can add your name to the **high score list**.

## Tips for winning

- **Use your head start:** Your opponents wait three seconds before throwing. Get your characters to safety before then.
- **Play with one character:** Keep the others as far back as you can so they stay safe.
- **Throw from cover:** Charge your throw somewhere safe. Move your character forward to throw, then pull them straight back.
- **Aim carefully:** Your snowballs fly slightly upward. A low position often makes it easier to land a hit.
- **Use full throwing power:** Give your throw a little more time to charge. Weak throws often fall short of the opponent.
- **One at a time:** Try to knock out one opponent before attacking the next. Fewer opponents mean fewer snowballs coming your way!

**Remember:** The fewer hits your characters take and the faster you win, the more points you earn!

## Want to discover more of Roth?

Recognize some of the places in the game? No wonder! The locations show familiar corners of our lovely hometown of **Roth**.

Want to explore more? On **[Rothzeit.de](https://rothzeit.de)**, you’ll find shops, restaurants, cafés and much more from our town, along with events and tips on what’s happening in Roth.

**Have fun on your snowball adventure through Roth!**
