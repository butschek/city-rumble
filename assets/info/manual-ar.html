# Roth Rumble

## معركة بكرات الثلج في روت!

هل أنت مستعد لبعض المرح بكرات الثلج؟ في **Roth Rumble**، تلعب بثلاث شخصيات حمراء في مواجهة فريق يزداد قوة مع تقدمك. اللعبة لكل من تتراوح أعمارهم بين **6 و99 عاماً**. من السهل تعلّمها، والفوز فيها تحدٍّ ممتع!

وما يميّزها هو أن **جميع مواقع اللعبة من مدينتنا الجميلة روت (Roth)!** اكتشف أماكن مألوفة من مدينتك وخض معركة بكرات الثلج في قلب روت. لعبة من روت، لأهل روت ولكل من يحب مدينتنا!

## طريقة اللعب

فريقك على اليمين، والخصوم على اليسار. **أخرج جميع الخصوم من اللعب قبل أن تخرج شخصياتك!** تتحمل كل شخصية من فريقك إصابتين، بينما يتحمل كل خصم ثلاث إصابات. بعد كل مستوى تفوز به، يزداد عدد الخصوم. في انتظارك **ستة مستويات**.

**التحكم:** أمسك إحدى شخصياتك الحمراء بالفأرة أو بإصبعك واسحبها إلى المكان الذي تريده. أبقِ الضغط لزيادة قوة الرمية. **عندما تفلت الشخصية، تنطلق كرة الثلج** نحو اليسار وإلى أعلى قليلاً. كلما أطلت الضغط، قطعت الكرة مسافة أطول.

## جمع النقاط

- **10 نقاط** لكل إصابة يبقى الخصم بعدها في اللعب
- **50 نقطة** للإصابة التي تُخرج الخصم من اللعب
- **1,000 نقطة** لكل مستوى تفوز به
- **حتى 2,700 نقطة إضافية** إذا تلقت شخصياتك أقل عدد ممكن من الإصابات
- **حتى 1,440 نقطة إضافية** إذا فزت بالمستوى بسرعة كبيرة

في نهاية اللعبة، يمكنك تسجيل اسمك في **قائمة أفضل النتائج**.

## نصائح للفوز

- **استفد من مهلة البداية:** لا يبدأ الخصوم بالرمي إلا بعد ثلاث ثوانٍ. انقل شخصياتك إلى مكان آمن قبل ذلك.
- **العب بشخصية واحدة:** أبقِ بقية الشخصيات في الخلف قدر الإمكان لتظل في أمان.
- **ارمِ من خلف ساتر:** جهّز الرمية في مكان آمن. حرّك شخصيتك إلى الأمام لترمي، ثم اسحبها إلى الخلف فوراً.
- **صوّب جيداً:** تطير كرات الثلج إلى أعلى قليلاً. كثيراً ما يكون التصويب من موقع منخفض أسهل.
- **ارمِ بأقصى قوة:** من الأفضل أن تضغط مدة أطول قليلاً. غالباً ما تقصر الرميات الضعيفة عن الوصول إلى الخصم.
- **واجه الخصوم واحداً تلو الآخر:** حاول إخراج خصم من اللعب قبل مهاجمة التالي. كلما قلّ عدد الخصوم، قلّت كرات الثلج التي يرمونها نحوك!

**تذكّر:** كلما قلّت الإصابات التي تتلقاها شخصياتك وأسرعت في الفوز، جمعت نقاطاً أكثر!

## هل تودّ اكتشاف المزيد من روت؟

هل تعرّفت على بعض الأماكن في اللعبة؟ لا عجب! فالمواقع تعرض أماكن مألوفة من مدينتنا الجميلة **روت**.

هل تودّ اكتشاف المزيد؟ ستجد على **[Rothzeit.de](https://rothzeit.de)** متاجر ومطاعم ومقاهي والكثير من الخيارات الأخرى في مدينتنا، بالإضافة إلى الفعاليات واقتراحات لما يمكنك القيام به في روت.

**استمتع بمعركتك بكرات الثلج في أنحاء روت!**
