# Roth Rumble

## Bitwa na śnieżki w Roth!

Czas na bitwę na śnieżki? W **Roth Rumble** grasz trzema czerwonymi postaciami przeciwko drużynie, która staje się coraz silniejsza. Gra jest dla wszystkich **od 6 do 99 lat**. Łatwo nauczyć się grać, a wygrać to już wyzwanie!

Co czyni tę grę wyjątkową? **Wszystkie miejsca w grze pochodzą z naszego pięknego miasta Roth!** Odkryj znajome miejsca z rodzinnego miasta i przeżyj bitwę na śnieżki w samym sercu Roth. Gra z Roth, dla Roth i wszystkich, którzy lubią nasze miasto!

## Jak grać

Twoja drużyna jest po prawej, a przeciwnicy po lewej. **Wyeliminuj wszystkich przeciwników, zanim twoje postacie odpadną!** Każda z twoich postaci wytrzymuje dwa trafienia, a każdy przeciwnik trzy. Po każdym wygranym poziomie przeciwników jest więcej. Łącznie czeka na ciebie **sześć poziomów**.

**Sterowanie:** Chwyć jedną z czerwonych postaci myszą lub palcem i przeciągnij ją w wybrane miejsce. Przytrzymaj, by zwiększyć siłę rzutu. **Gdy puścisz postać, śnieżka poleci** w lewo i lekko w górę. Im dłużej przytrzymasz, tym dalej poleci.

## Zdobywanie punktów

- **10 punktów** za każde trafienie, po którym przeciwnik pozostaje w grze
- **50 punktów** za trafienie eliminujące przeciwnika
- **1000 punktów** za każdy wygrany poziom
- **Do 2700 punktów bonusowych**, jeśli twoje postacie zostaną trafione jak najmniej razy
- **Do 1440 punktów bonusowych**, jeśli wygrasz poziom wyjątkowo szybko

Po grze możesz wpisać swoje imię na **listę najlepszych wyników**.

## Wskazówki, jak wygrać

- **Wykorzystaj przewagę na starcie:** Przeciwnicy zaczną rzucać dopiero po trzech sekundach. Wcześniej schowaj swoje postacie w bezpiecznym miejscu.
- **Graj jedną postacią:** Pozostałe trzymaj jak najdalej z tyłu, gdzie będą bezpieczne.
- **Rzucaj zza osłony:** Nabierz siły do rzutu w bezpiecznym miejscu. Przesuń postać do przodu, żeby rzucić, a potem od razu ją wycofaj.
- **Celuj uważnie:** Twoje śnieżki lecą lekko w górę. Z niższej pozycji często łatwiej trafić.
- **Rzucaj z pełną siłą:** Warto przytrzymać postać trochę dłużej. Zbyt słabe rzuty często nie sięgają przeciwnika.
- **Po kolei:** Spróbuj wyeliminować jednego przeciwnika, zanim zaatakujesz następnego. Mniej przeciwników to mniej śnieżek lecących w twoją stronę!

**Pamiętaj:** Im mniej trafień przyjmą twoje postacie i im szybciej wygrasz, tym więcej punktów zdobędziesz!

## Chcesz odkryć więcej zakątków Roth?

Rozpoznajesz niektóre miejsca w grze? Nic dziwnego! To znajome zakątki naszego pięknego rodzinnego miasta **Roth**.

Chcesz odkryć więcej? Na **[Rothzeit.de](https://rothzeit.de)** znajdziesz sklepy, restauracje, kawiarnie i wiele innych ofert z naszego miasta, a także wydarzenia i podpowiedzi, co się dzieje w Roth.

**Udanej bitwy na śnieżki w Roth!**
