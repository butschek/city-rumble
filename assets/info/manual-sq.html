# Roth Rumble

## Betejë me topa bore në Roth!

Gati për një betejë me topa bore? Në **Roth Rumble** luan me tre personazhe të kuq kundër një ekipi që bëhet gjithnjë e më i fortë. Loja është për të gjithë **nga 6 deri në 99 vjeç**. Është e lehtë për t’u mësuar, por për të fituar duhet përpjekje!

Çfarë e bën lojën të veçantë? **Të gjitha vendet në lojë janë nga qyteti ynë i bukur, Roth!** Zbulo vende të njohura nga qyteti yt dhe bëj një betejë me topa bore në zemër të Rothit. Një lojë nga Rothi, për Rothin dhe për këdo që e do qytetin tonë!

## Si të luash

Ekipi yt është në të djathtë dhe kundërshtarët janë në të majtë. **Nxirri nga loja të gjithë kundërshtarët para se të munden personazhet e tu!** Secili nga personazhet e tu përballon dy goditje, ndërsa secili kundërshtar përballon tri. Pas çdo niveli që fiton, numri i kundërshtarëve rritet. Gjithsej të presin **gjashtë nivele**.

**Komandat:** Kape njërin nga personazhet e kuq me maus ose me gisht dhe tërhiqe ku të duash. Mbaje shtypur për të shtuar forcën e hedhjes. **Kur ta lëshosh, topi i borës fluturon** majtas dhe pak lart. Sa më gjatë ta mbash, aq më larg fluturon.

## Si të mbledhësh pikë

- **10 pikë** për çdo goditje pas së cilës kundërshtari mbetet në lojë
- **50 pikë** për një goditje që nxjerr një kundërshtar nga loja
- **1 000 pikë** për çdo nivel që fiton
- **Deri në 2 700 pikë bonus** kur personazhet e tu goditen sa më pak
- **Deri në 1 440 pikë bonus** kur e fiton nivelin shumë shpejt

Në fund të lojës mund ta shtosh emrin tënd në **listën e rekordeve**.

## Këshilla për të fituar

- **Shfrytëzo përparësinë në fillim:** Kundërshtarët hedhin topa bore vetëm pas tri sekondash. Çoji personazhet e tu në një vend të sigurt para kësaj.
- **Luaj me një personazh:** Mbaji të tjerët sa më prapa që të jenë të mbrojtur.
- **Hidh nga streha:** Përgatite hedhjen në një vend të sigurt. Nxirre personazhin përpara për të hedhur dhe pastaj tërhiqe menjëherë prapa.
- **Merr shenjë mirë:** Topat e tu të borës fluturojnë pak lart. Shpesh godet më lehtë nga një pozicion më i ulët.
- **Hidh me forcë të plotë:** Është më mirë ta mbash shtypur pak më gjatë. Hedhjet e dobëta shpesh nuk arrijnë te kundërshtari.
- **Një nga një:** Përpiqu ta nxjerrësh nga loja një kundërshtar para se të sulmosh tjetrin. Më pak kundërshtarë do të thotë më pak topa bore që vijnë drejt teje!

**Mbaj mend:** Sa më pak të goditen personazhet e tu dhe sa më shpejt të fitosh, aq më shumë pikë mbledh!

## Do të zbulosh më shumë nga Rothi?

I njeh disa nga vendet në lojë? S’është çudi! Ato tregojnë cepa të njohur të qytetit tonë të dashur, **Roth**.

Do të zbulosh më shumë? Në **[Rothzeit.de](https://rothzeit.de)** gjen dyqane, restorante, kafene e shumë oferta të tjera nga qyteti ynë, si edhe ngjarje e sugjerime se çfarë po ndodh në Roth.

**Argëtohu në betejën me topa bore nëpër Roth!**
